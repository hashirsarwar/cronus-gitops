apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "cronus-ordering-service.labels" . | nindent 4 }}
spec:
  # Keep ordering internal; the Gateway routes public /api requests to this Service.
  type: ClusterIP
  selector:
    {{- include "cronus-ordering-service.serverSelector" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
