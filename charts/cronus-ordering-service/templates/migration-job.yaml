{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-migrate
  labels:
    {{- include "cronus-ordering-service.labels" . | nindent 4 }}
  annotations:
    # Fail sync before rolling out workloads if their schema migration fails.
    argocd.argoproj.io/hook: PreSync
    # Delete the previous hook Job before each sync; Job pod templates are immutable.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # A migration is safe to run twice, so retrying a transient failure is worth doing. A genuine error
  # in a migration fails identically every time, so the limit stays small rather than letting a
  # broken migration retry for minutes before reporting it.
  backoffLimit: 2
  # Bounds a migration that hangs, so the sync fails instead of waiting indefinitely.
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "cronus-ordering-service.labels" . | nindent 8 }}
        # Use migration component labels so the Service cannot route traffic to these non-serving pods.
        app.kubernetes.io/component: migration
        azure.workload.identity/use: "true"
    spec:
      # The migration identity, which may create and alter tables. The service's identity may not, so
      # running this job as the service would fail; and granting the service this identity would
      # collapse the boundary the database enforces between changing a schema and using one.
      serviceAccountName: {{ .Values.migration.serviceAccountName }}
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          # The same image the Deployment runs, so the schema is applied by exactly the build that was
          # tested rather than by a second artefact that could drift from it.
          image: {{ include "cronus-ordering-service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Selects the migration mode in Program.cs: pending migrations are applied, then the process
          # exits. It exits non-zero if a migration fails, which fails the job and therefore the sync.
          args:
            - migrate
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__{{ .Values.database.connectionStringName }}
              value: {{ include "cronus-ordering-service.connectionString" (dict
                "host" .Values.database.host
                "name" .Values.database.name
                "username" .Values.migration.username) | quote }}
            # Use writable /tmp for runtime sockets on the read-only root filesystem.
            # This job supplies no telemetry connection string, so no exporter queue is created.
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            # Use the same resource budget as the service so memory starvation cannot silently stall migrations.
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # A migration reads the model out of the assembly and writes only to PostgreSQL, so nothing
            # under / is written here either.
            readOnlyRootFilesystem: true
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
