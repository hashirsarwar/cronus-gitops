apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "cronus-web.labels" . | nindent 4 }}
spec:
  # Keep the Service internal; the Gateway exposes the UI and routes /api directly to ordering.
  type: ClusterIP
  selector:
    {{- include "cronus-web.serverSelector" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
