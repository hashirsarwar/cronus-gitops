# Keep runtime and migration identities separate: serving pods must not hold schema-changing privileges.
# Client IDs come from Terraform outputs and must match the namespace/ServiceAccount federated subjects.
# Workload identity projects tokens without storing database credentials; see README.md, Ordering.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronus-ordering-service
  namespace: cronus-dev
  annotations:
    azure.workload.identity/client-id: "9805e592-4087-49d6-b2f2-83cc6d36e1e2"
  labels:
    app.kubernetes.io/part-of: cronus
    app.kubernetes.io/managed-by: argocd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronus-delivery-service
  namespace: cronus-dev
  annotations:
    azure.workload.identity/client-id: "ce25aa74-d960-4c96-a29f-51f7e49c285e"
  labels:
    app.kubernetes.io/part-of: cronus
    app.kubernetes.io/managed-by: argocd
---
