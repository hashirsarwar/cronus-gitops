# Keep runtime and migration identities separate: serving pods must not hold schema-changing privileges.
# Client IDs come from Terraform outputs and must match the namespace/ServiceAccount federated subjects.
# Workload identity projects tokens without storing database credentials; see README.md, Ordering.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronus-ordering-service
  namespace: cronus-prod
  annotations:
    azure.workload.identity/client-id: "be88efc1-3f56-4ffb-8810-76efd709f510"
  labels:
    app.kubernetes.io/part-of: cronus
    app.kubernetes.io/managed-by: argocd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronus-delivery-service
  namespace: cronus-prod
  annotations:
    azure.workload.identity/client-id: "52b8fe05-dc0c-462b-b24c-d9e19c6fbb8a"
  labels:
    app.kubernetes.io/part-of: cronus
    app.kubernetes.io/managed-by: argocd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronus-ordering-migrations
  namespace: cronus-prod
  annotations:
    azure.workload.identity/client-id: "e101ea63-962d-4c21-9dde-317f4fccaa7a"
  labels:
    app.kubernetes.io/part-of: cronus
    app.kubernetes.io/managed-by: argocd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronus-delivery-migrations
